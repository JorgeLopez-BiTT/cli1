name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-playwright-dev:
    name: "Job 1 – playwright.dev tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run playwright.dev tests
        run: npx playwright test tests/example.spec.ts tests/search.spec.ts --project=chromium

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-playwright-dev
          path: playwright-report/
          retention-days: 30

  test-purchase-flow:
    name: "Job 2 – purchase flow tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run purchase flow tests
        run: npx playwright test tests/purchase-flow.spec.ts --project=chromium
        env:
          ALLURE_REPORT: "true"

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report-purchase-flow
          path: allure-report/
          retention-days: 30

      - name: Upload Allure results (raw)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-purchase-flow
          path: allure-results/
          retention-days: 30
